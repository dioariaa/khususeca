<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panduan Alat Uji Statistik</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0c0f1a;
    --surface:  #131726;
    --glass:    rgba(255,255,255,0.04);
    --border:   rgba(255,255,255,0.08);
    --border-h: rgba(255,255,255,0.16);
    --text:     #e8ecf4;
    --muted:    #7a849e;
    --faint:    #3a4259;

    --nominal-bg:   rgba(255,105,80,0.12);
    --nominal-bdr:  rgba(255,105,80,0.35);
    --nominal-clr:  #ff8a72;
    --nominal-glow: rgba(255,105,80,0.15);

    --ordinal-bg:   rgba(255,185,60,0.12);
    --ordinal-bdr:  rgba(255,185,60,0.35);
    --ordinal-clr:  #ffcb6b;
    --ordinal-glow: rgba(255,185,60,0.12);

    --interval-bg:   rgba(80,180,255,0.12);
    --interval-bdr:  rgba(80,180,255,0.35);
    --interval-clr:  #73c8ff;
    --interval-glow: rgba(80,180,255,0.12);

    --para-bg:   rgba(80,220,160,0.12);
    --para-bdr:  rgba(80,220,160,0.35);
    --para-clr:  #5fe0a8;

    --nonpara-bg:   rgba(170,100,255,0.12);
    --nonpara-bdr:  rgba(170,100,255,0.35);
    --nonpara-clr:  #c47eff;

    --gold: #f0c060;
    --radius: 14px;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.65;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow blobs */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: -150px;
    width: 600px;
    height: 600px;
    background: radial-gradient(ellipse, rgba(80,180,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .glow-blob-2 {
    position: fixed;
    bottom: -200px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(255,105,80,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(12,15,26,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px 14px;
  }

  .header-inner {
    max-width: 820px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 14px;
  }

  .site-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .site-subtitle {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    font-style: italic;
  }

  /* Search */
  .search-box {
    position: relative;
    margin-bottom: 12px;
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 14px;
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 36px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input::placeholder { color: var(--muted); }

  .search-input:focus {
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
  }

  /* Filter Pills */
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 10px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 2px;
    font-weight: 500;
  }

  .filter-btn {
    padding: 5px 13px;
    font-size: 11.5px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.02em;
  }

  .filter-btn:hover { border-color: var(--border-h); color: var(--text); }

  .filter-btn.active-semua    { border-color: rgba(240,192,96,0.5); background: rgba(240,192,96,0.1); color: var(--gold); }
  .filter-btn.active-nominal  { border-color: var(--nominal-bdr); background: var(--nominal-bg); color: var(--nominal-clr); }
  .filter-btn.active-ordinal  { border-color: var(--ordinal-bdr); background: var(--ordinal-bg); color: var(--ordinal-clr); }
  .filter-btn.active-interval { border-color: var(--interval-bdr); background: var(--interval-bg); color: var(--interval-clr); }
  .filter-btn.active-parametrik { border-color: var(--para-bdr); background: var(--para-bg); color: var(--para-clr); }
  .filter-btn.active-nonpara  { border-color: var(--nonpara-bdr); background: var(--nonpara-bg); color: var(--nonpara-clr); }

  /* ─── MAIN ─── */
  .main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .count-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .count-text {
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 400;
  }

  .count-num {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--gold);
    font-weight: 600;
  }

  /* ─── CARDS ─── */
  .cards-grid { display: flex; flex-direction: column; gap: 10px; }

  .uji-card {
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    animation: fadeSlide 0.35s ease both;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .uji-card:hover {
    border-color: var(--border-h);
    transform: translateY(-1px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .uji-card.open { border-color: rgba(255,255,255,0.15); }
  .uji-card.open.cat-nominal  { border-color: var(--nominal-bdr); box-shadow: 0 0 24px var(--nominal-glow); }
  .uji-card.open.cat-ordinal  { border-color: var(--ordinal-bdr); box-shadow: 0 0 24px var(--ordinal-glow); }
  .uji-card.open.cat-interval { border-color: var(--interval-bdr); box-shadow: 0 0 24px var(--interval-glow); }

  /* Card Header */
  .card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    user-select: none;
  }

  .card-icon {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .icon-nominal  { background: var(--nominal-bg);  box-shadow: inset 0 0 0 1px var(--nominal-bdr); }
  .icon-ordinal  { background: var(--ordinal-bg);  box-shadow: inset 0 0 0 1px var(--ordinal-bdr); }
  .icon-interval { background: var(--interval-bg); box-shadow: inset 0 0 0 1px var(--interval-bdr); }

  .card-meta { flex: 1; min-width: 0; }

  .card-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.1px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 5px;
  }

  .tag {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 9px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .t-nominal   { background: var(--nominal-bg);   color: var(--nominal-clr);   border: 1px solid var(--nominal-bdr); }
  .t-ordinal   { background: var(--ordinal-bg);   color: var(--ordinal-clr);   border: 1px solid var(--ordinal-bdr); }
  .t-interval  { background: var(--interval-bg);  color: var(--interval-clr);  border: 1px solid var(--interval-bdr); }
  .t-para      { background: var(--para-bg);      color: var(--para-clr);      border: 1px solid var(--para-bdr); }
  .t-nonpara   { background: var(--nonpara-bg);   color: var(--nonpara-clr);   border: 1px solid var(--nonpara-bdr); }

  .chevron {
    width: 28px;
    height: 28px;
    min-width: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.25s, background 0.2s;
  }

  .uji-card.open .chevron {
    transform: rotate(180deg);
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }

  /* Card Body */
  .card-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .uji-card.open .card-body { max-height: 800px; }

  .card-body-inner {
    padding: 0 16px 18px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
    margin-top: 14px;
  }

  .body-section { }
  .body-section.full { grid-column: 1 / -1; }

  .body-label {
    font-size: 9.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .label-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .sec-def   .body-label { color: var(--interval-clr); }
  .sec-def   .label-dot  { background: var(--interval-clr); }
  .sec-when  .body-label { color: var(--para-clr); }
  .sec-when  .label-dot  { background: var(--para-clr); }
  .sec-req   .body-label { color: var(--nominal-clr); }
  .sec-req   .label-dot  { background: var(--nominal-clr); }
  .sec-ex    .body-label { color: var(--ordinal-clr); }
  .sec-ex    .label-dot  { background: var(--ordinal-clr); }

  .body-text {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.65;
    font-weight: 300;
  }

  .body-text strong { color: var(--text); font-weight: 500; }

  .example-box {
    background: rgba(255,185,60,0.06);
    border: 1px solid rgba(255,185,60,0.18);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: rgba(255,203,107,0.85);
    line-height: 1.6;
    font-style: italic;
    font-weight: 300;
  }

  /* No result */
  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--faint);
    font-size: 14px;
  }

  .no-result span { display: block; font-size: 36px; margin-bottom: 12px; }

  /* ─── LEGEND ─── */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Scroll to top */
  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
  }

  .scroll-top.visible { opacity: 1; pointer-events: all; }
  .scroll-top:hover { border-color: var(--border-h); color: var(--text); transform: translateY(-2px); }

  /* Responsive */
  @media (max-width: 580px) {
    .site-header { padding: 14px 16px 12px; }
    .main { padding: 18px 16px 80px; }
    .card-body-inner { grid-template-columns: 1fr; }
    .body-section.full { grid-column: 1; }
    .card-name { font-size: 13.5px; white-space: normal; }
    .header-top { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>

<div class="glow-blob-2"></div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <h1 class="site-title">Alat Uji Statistik</h1>
      <span class="site-subtitle">Panduan Lengkap untuk Penelitian Sosial</span>
    </div>

    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Cari uji statistik... (Anova, Spearman, Chi-square, t-test...)"
        oninput="filterCards()" />
    </div>

    <div class="filter-row">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active-semua"    data-filter="semua"      onclick="setFilter('semua',this)">Semua</button>
      <button class="filter-btn"                data-filter="nominal"    onclick="setFilter('nominal',this)">Nominal</button>
      <button class="filter-btn"                data-filter="ordinal"    onclick="setFilter('ordinal',this)">Ordinal</button>
      <button class="filter-btn"                data-filter="interval"   onclick="setFilter('interval',this)">Interval/Rasio</button>
      <button class="filter-btn"                data-filter="parametrik" onclick="setFilter('parametrik',this)">Parametrik</button>
      <button class="filter-btn"                data-filter="nonpara"    onclick="setFilter('nonpara',this)">Non-Parametrik</button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--nominal-clr)"></span>Nominal — data kategori tanpa urutan</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--ordinal-clr)"></span>Ordinal — data bertingkat/berurutan</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--interval-clr)"></span>Interval/Rasio — data numerik kontinu</div>
  </div>

  <div class="count-bar">
    <span class="count-text">Menampilkan <span class="count-num" id="countNum">0</span> alat uji</span>
    <span class="count-text" id="filterLabel"></span>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>
</main>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
const data = [
  // ── NOMINAL ──
  {

    skala: ["nominal"], jenis: ["nonpara"],
    icon: "icon-nominal", cat: "cat-nominal", emoji: "2️⃣",

    kapan: "Satu sampel, data nominal <strong>≥2 kategori</strong>, membandingkan distribusi observasi vs teori.",

  },
  {

    deskripsi: "Menguji apakah ada perbedaan distribusi frekuensi antara dua kelompok independen. Uji yang paling umum untuk data nominal dengan dua kelompok bebas dan sampel besar.",

  {

    skala: ["nominal"], jenis: ["nonpara"],

  },
  {
    name: "Contingency Coefficient C",

let activeFilter = 'semua';
let searchQuery = '';
let openCards = new Set();

function setFilter(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.className = 'filter-btn';
  });
  btn.classList.add('active-' + filter);
  openCards.clear();
  renderCards();
}

function filterCards() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  openCards.clear();
  renderCards();
}

function renderCards() {
  const grid = document.getElementById('cardsGrid');
  const filtered = data.filter(d => {
    const mf = activeFilter === 'semua'
      || (activeFilter === 'nominal'    && d.skala.includes('nominal'))
      || (activeFilter === 'ordinal'    && d.skala.includes('ordinal'))
      || (activeFilter === 'interval'   && d.skala.includes('interval'))
      || (activeFilter === 'parametrik' && d.jenis.includes('parametrik'))
      || (activeFilter === 'nonpara'    && d.jenis.includes('nonpara'));
    const ms = !searchQuery
      || d.name.toLowerCase().includes(searchQuery)
      || d.deskripsi.toLowerCase().includes(searchQuery)
      || d.kapan.toLowerCase().includes(searchQuery);
    return mf && ms;
  });

  document.getElementById('countNum').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-result"><span>🔍</span>Tidak ada hasil untuk "<strong>${searchQuery}</strong>".<br>Coba kata kunci lain.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((d, i) => {
    const skalaTags = d.skala.map(s =>
      s === 'nominal'  ? '<span class="tag t-nominal">Nominal</span>' :
      s === 'ordinal'  ? '<span class="tag t-ordinal">Ordinal</span>' :
                         '<span class="tag t-interval">Interval/Rasio</span>'
    ).join('');
    const jenisTags = d.jenis.map(j =>
      j === 'parametrik' ? '<span class="tag t-para">Parametrik</span>'
                         : '<span class="tag t-nonpara">Non-Parametrik</span>'
    ).join('');

    const isOpen = openCards.has(i);
    return `
    <div class="uji-card ${d.cat} ${isOpen ? 'open' : ''}" id="card-${i}" onclick="toggleCard(${i})">
      <div class="card-header">
        <div class="card-icon ${d.icon}">${d.emoji}</div>
        <div class="card-meta">
          <div class="card-name">${d.name}</div>
          <div class="card-tags">${skalaTags}${jenisTags}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="body-section sec-def">
            <div class="body-label"><span class="label-dot"></span>Pengertian</div>
            <div class="body-text">${d.deskripsi}</div>
          </div>
          <div class="body-section sec-when">
            <div class="body-label"><span class="label-dot"></span>Kapan Digunakan</div>
            <div class="body-text">${d.kapan}</div>
          </div>
          <div class="body-section sec-req">
            <div class="body-label"><span class="label-dot"></span>Syarat Penggunaan</div>
            <div class="body-text">${d.syarat}</div>
          </div>
          <div class="body-section sec-ex full">
            <div class="body-label"><span class="label-dot"></span>Contoh Kasus</div>
            <div class="example-box">${d.contoh}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  if (openCards.has(i)) {
    openCards.delete(i);
    card.classList.remove('open');
  } else {
    openCards.add(i);
    card.classList.add('open');
  }
}

// Scroll to top button
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scrollTopBtn');
  btn.classList.toggle('visible', window.scrollY > 300);
});

renderCards();
