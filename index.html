<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panduan Uji Statistik Punya Marisa🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky:       #c6e9f9;
  --sky-deep:  #a8d8f0;
  --white:     #ffffff;
  --cream:     #f5fbff;
  --pink:      #f9c6d4;
  --pink-deep: #f4a0b8;
  --blue:      #7bc4e2;
  --blue-deep: #5aaed4;
  --lavender:  #d4c0f0;
  --text:      #4a6880;
  --muted:     #8aafc4;
  --faint:     #b8d4e8;
  --border:    rgba(110,190,230,0.35);

  --nom-bg:  #fff0f4; --nom-bdr: #f9c6d4; --nom-clr: #d4607a; --nom-tag-bg: #fce4ec;
  --ord-bg:  #f3f0ff; --ord-bdr: #d4c0f0; --ord-clr: #8060c0; --ord-tag-bg: #ede7f6;
  --int-bg:  #edf8ff; --int-bdr: #a8d8f0; --int-clr: #3a8ab0; --int-tag-bg: #e1f5fe;
  --par-bg:  #edfff5; --par-bdr: #a8e8c8; --par-clr: #2e8060; --par-tag-bg: #e8f5e9;
  --non-bg:  #fff8ed; --non-bdr: #ffd0a0; --non-clr: #c07030; --non-tag-bg: #fff3e0;

  --shadow: 0 4px 20px rgba(100,180,220,0.15);
  --shadow-h: 0 8px 32px rgba(100,180,220,0.25);
  --radius: 20px;
  --radius-sm: 12px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Nunito', sans-serif;
  font-size: 14px;
  line-height: 1.65;
  color: var(--text);
  min-height: 100vh;
  background: linear-gradient(180deg, #c8ebf9 0%, #ddf2fb 30%, #eef8fd 60%, #f8fdff 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

/* ─── CLOUDS BG ─── */
.clouds-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.cloud {
  position: absolute;
  opacity: 0.55;
  animation: drift linear infinite;
}

.cloud svg { display: block; }

@keyframes drift {
  from { transform: translateX(-220px); }
  to   { transform: translateX(110vw); }
}

/* ─── STARS ─── */
.stars-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  font-size: 12px;
  opacity: 0.4;
  animation: twinkle 3s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50%       { opacity: 0.7; transform: scale(1.2); }
}

/* ─── HEADER ─── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 2px solid rgba(180,220,240,0.5);
  padding: 14px 24px 12px;
  box-shadow: 0 2px 20px rgba(100,180,220,0.12);
}

.header-inner { max-width: 820px; margin: 0 auto; }

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.cinna-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #c6e9f9, #a8d4ee);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 3px 12px rgba(100,180,220,0.3);
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.8);
}

.header-titles { flex: 1; }

.site-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--blue-deep);
  letter-spacing: -0.3px;
  line-height: 1.2;
}

.site-title span { color: var(--pink-deep); }

.site-subtitle {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 1px;
}

/* Search */
.search-box { position: relative; margin-bottom: 12px; }

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background: var(--cream);
  border: 2px solid var(--border);
  border-radius: 50px;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: inset 0 2px 6px rgba(100,180,220,0.08);
}

.search-input::placeholder { color: var(--muted); }

.search-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(123,196,226,0.18);
}

/* Filters */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.filter-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  letter-spacing: 0.04em;
}

.filter-btn {
  padding: 5px 14px;
  font-size: 12px;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  border-radius: 50px;
  border: 2px solid var(--faint);
  background: var(--white);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
}

.filter-btn:hover { border-color: var(--blue); color: var(--blue-deep); transform: translateY(-1px); }

.filter-btn.act-semua    { border-color: var(--blue);      background: linear-gradient(135deg, #c6e9f9, #a8d4ee); color: var(--blue-deep); }
.filter-btn.act-nominal  { border-color: var(--nom-bdr);   background: var(--nom-tag-bg);  color: var(--nom-clr); }
.filter-btn.act-ordinal  { border-color: var(--ord-bdr);   background: var(--ord-tag-bg);  color: var(--ord-clr); }
.filter-btn.act-interval { border-color: var(--int-bdr);   background: var(--int-tag-bg);  color: var(--int-clr); }
.filter-btn.act-parametrik { border-color: var(--par-bdr); background: var(--par-tag-bg);  color: var(--par-clr); }
.filter-btn.act-nonpara  { border-color: var(--non-bdr);   background: var(--non-tag-bg);  color: var(--non-clr); }

/* ─── MAIN ─── */
.main {
  max-width: 820px;
  margin: 0 auto;
  padding: 22px 24px 100px;
  position: relative;
  z-index: 1;
}

/* Legend */
.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.75);
  border: 2px solid rgba(180,220,240,0.5);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Count bar */
.count-bar {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
}

.count-text { font-size: 12px; color: var(--muted); font-weight: 600; }
.count-num  { font-size: 15px; color: var(--blue-deep); font-weight: 800; }

/* ─── CARDS ─── */
.cards-grid { display: flex; flex-direction: column; gap: 12px; }

.uji-card {
  background: rgba(255,255,255,0.88);
  border: 2px solid rgba(180,220,240,0.5);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.18s;
  animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.uji-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-h);
}

.uji-card.open                 { border-color: rgba(100,180,220,0.6); }
.uji-card.open.cat-nom         { border-color: var(--nom-bdr); box-shadow: 0 8px 28px rgba(240,160,180,0.25); }
.uji-card.open.cat-ord         { border-color: var(--ord-bdr); box-shadow: 0 8px 28px rgba(180,160,230,0.25); }
.uji-card.open.cat-int         { border-color: var(--int-bdr); box-shadow: 0 8px 28px rgba(100,180,220,0.25); }

/* Card header */
.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  user-select: none;
}

.card-icon {
  width: 42px; height: 42px;
  min-width: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  position: relative;
}

.ci-nom { background: linear-gradient(135deg, #fce4ec, #f9c6d4); border: 2px solid #f9c6d4; }
.ci-ord { background: linear-gradient(135deg, #ede7f6, #d4c0f0); border: 2px solid #d4c0f0; }
.ci-int { background: linear-gradient(135deg, #e1f5fe, #a8d8f0); border: 2px solid #a8d8f0; }

.card-meta { flex: 1; min-width: 0; }

.card-name {
  font-size: 14.5px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.1px;
  line-height: 1.3;
}

.card-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }

.tag {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 50px;
  border: 1.5px solid;
  letter-spacing: 0.02em;
}

.t-nom { background: var(--nom-tag-bg); color: var(--nom-clr); border-color: var(--nom-bdr); }
.t-ord { background: var(--ord-tag-bg); color: var(--ord-clr); border-color: var(--ord-bdr); }
.t-int { background: var(--int-tag-bg); color: var(--int-clr); border-color: var(--int-bdr); }
.t-par { background: var(--par-tag-bg); color: var(--par-clr); border-color: var(--par-bdr); }
.t-non { background: var(--non-tag-bg); color: var(--non-clr); border-color: var(--non-bdr); }

.chevron {
  width: 30px; height: 30px;
  min-width: 30px;
  border-radius: 50%;
  background: var(--cream);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--muted);
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), background 0.2s;
}

.uji-card.open .chevron {
  transform: rotate(180deg);
  background: var(--sky);
  border-color: var(--blue);
  color: var(--blue-deep);
}

/* Card body */
.card-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1);
}

.uji-card.open .card-body { max-height: 900px; }

.card-body-inner {
  padding: 0 16px 18px;
  margin-top: 12px;
  border-top: 2px dashed rgba(180,220,240,0.6);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 18px;
}

.body-section { }
.body-section.full { grid-column: 1 / -1; }

.body-label {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.lbl-icon { font-size: 12px; }

.sec-def  .body-label { color: var(--int-clr); }
.sec-when .body-label { color: var(--par-clr); }
.sec-req  .body-label { color: var(--nom-clr); }
.sec-ex   .body-label { color: #b07030; }

.body-text {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.7;
  font-weight: 500;
}

.body-text strong { color: var(--text); font-weight: 700; }
.body-text em { color: var(--blue-deep); font-style: normal; font-weight: 700; }

.example-box {
  background: linear-gradient(135deg, #fff8f0, #fff3e8);
  border: 2px solid var(--non-bdr);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 12.5px;
  color: #a06030;
  line-height: 1.65;
  font-weight: 500;
  position: relative;
  padding-left: 36px;
}

.example-box::before {
  content: "🌸";
  position: absolute;
  left: 10px;
  top: 11px;
  font-size: 14px;
}

/* No result */
.no-result {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
}

.no-result .no-emoji { font-size: 48px; display: block; margin-bottom: 12px; }

/* Scroll top */
.scroll-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c6e9f9, #a8d4ee);
  border: 2px solid var(--blue);
  color: var(--blue-deep);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  z-index: 50;
  opacity: 0; pointer-events: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
}

.scroll-top.visible { opacity: 1; pointer-events: all; }
.scroll-top:hover { transform: translateY(-3px) scale(1.08); box-shadow: var(--shadow-h); }

/* Cinnamoroll deco footer */
.deco-footer {
  text-align: center;
  padding: 8px;
  font-size: 20px;
  letter-spacing: 6px;
  opacity: 0.5;
}

@media (max-width: 580px) {
  .site-header { padding: 12px 16px 10px; }
  .main { padding: 16px 16px 80px; }
  .card-body-inner { grid-template-columns: 1fr; }
  .body-section.full { grid-column: 1; }
  .site-title { font-size: 17px; }
  .header-top { gap: 10px; }
}
</style>
</head>
<body>

<!-- Floating clouds -->
<div class="clouds-bg" id="cloudsBg"></div>

<!-- Twinkling stars -->
<div class="stars-bg" id="starsBg"></div>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <div class="cinna-icon"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjUuURH3Ynl8_8WeFtOZbujwvP5zvK8VVycQ&s" alt="" style="height: 80px; border-radius: 15px;"></div>
      <div class="header-titles">
        <div class="site-title">Panduan Uji <span>Statistik</span> Punya Marisa✨</div>
        <div class="site-subtitle">Belajar jadi lebih manis bersama Cinnamoroll ☁️</div>
      </div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text"
        placeholder="Cari nama uji... (Anova, Spearman, Chi-square, t-test...)"
        oninput="filterCards()" />
    </div>

    <div class="filter-row">
      <span class="filter-label">Filter ☁️</span>
      <button class="filter-btn act-semua"    data-f="semua"      onclick="setFilter('semua',this)">🌸 Semua</button>
      <button class="filter-btn"              data-f="nominal"    onclick="setFilter('nominal',this)">🎀 Nominal</button>
      <button class="filter-btn"              data-f="ordinal"    onclick="setFilter('ordinal',this)">💜 Ordinal</button>
      <button class="filter-btn"              data-f="interval"   onclick="setFilter('interval',this)">💙 Interval</button>
      <button class="filter-btn"              data-f="parametrik" onclick="setFilter('parametrik',this)">🌿 Parametrik</button>
      <button class="filter-btn"              data-f="nonpara"    onclick="setFilter('nonpara',this)">🍊 Non-Para</button>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#f9a0b8"></span>Nominal — kategori tanpa urutan</div>
    <div class="legend-item"><span class="legend-dot" style="background:#c4a8e8"></span>Ordinal — data bertingkat</div>
    <div class="legend-item"><span class="legend-dot" style="background:#80c8e8"></span>Interval/Rasio — data numerik kontinu</div>
  </div>

  <div class="count-bar">
    <span class="count-text">Menampilkan <span class="count-num" id="countNum">0</span> alat uji ✨</span>
  </div>

  <div class="cards-grid" id="cardsGrid"></div>

  <div class="deco-footer">🐾 ☁️ ⭐ ☁️ 🎀 ☁️ ⭐ ☁️ 🐾</div>
</main>

<button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ── Generate clouds ──
const cloudBg = document.getElementById('cloudsBg');
const cloudShapes = [
  `<svg width="120" height="50" viewBox="0 0 120 50" fill="none"><ellipse cx="60" cy="38" rx="55" ry="18" fill="white"/><ellipse cx="40" cy="30" rx="28" ry="22" fill="white"/><ellipse cx="75" cy="28" rx="25" ry="20" fill="white"/><ellipse cx="58" cy="20" rx="20" ry="18" fill="white"/></svg>`,
  `<svg width="90" height="38" viewBox="0 0 90 38" fill="none"><ellipse cx="45" cy="30" rx="40" ry="14" fill="white"/><ellipse cx="30" cy="23" rx="22" ry="17" fill="white"/><ellipse cx="58" cy="22" rx="19" ry="16" fill="white"/><ellipse cx="44" cy="15" rx="15" ry="14" fill="white"/></svg>`,
  `<svg width="150" height="55" viewBox="0 0 150 55" fill="none"><ellipse cx="75" cy="44" rx="68" ry="18" fill="white"/><ellipse cx="48" cy="34" rx="34" ry="26" fill="white"/><ellipse cx="95" cy="32" rx="30" ry="24" fill="white"/><ellipse cx="72" cy="22" rx="24" ry="20" fill="white"/></svg>`,
];

for (let i = 0; i < 7; i++) {
  const div = document.createElement('div');
  div.className = 'cloud';
  const top = Math.random() * 75;
  const dur = 28 + Math.random() * 30;
  const delay = -Math.random() * dur;
  const scale = 0.6 + Math.random() * 0.8;
  div.style.cssText = `top:${top}%;left:-220px;transform:scale(${scale});animation-duration:${dur}s;animation-delay:${delay}s;`;
  div.innerHTML = cloudShapes[i % cloudShapes.length];
  cloudBg.appendChild(div);
}

// ── Generate stars ──
const starBg = document.getElementById('starsBg');
const starEmojis = ['⭐','✨','🌟','💫','⭐'];
for (let i = 0; i < 18; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.textContent = starEmojis[i % starEmojis.length];
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*2}s;font-size:${10+Math.random()*8}px;`;
  starBg.appendChild(s);
}

// ── DATA ──
const data = [
  // ── NOMINAL ──
  { name:"Binomial Test", skala:["nominal"],jenis:["nonpara"], ci:"ci-nom",cat:"cat-nom",emoji:"2️⃣",
    deskripsi:"Menguji apakah proporsi observasi pada dua kategori sesuai dengan proporsi yang dihipotesiskan. Digunakan ketika data hanya memiliki dua kemungkinan hasil (ya/tidak, sukses/gagal).",
    kapan:"Satu sampel, data nominal dengan <strong>2 kategori</strong>, ingin menguji apakah proporsi sesuai teori.",
    syarat:"Data berskala nominal, hanya ada <strong>2 kategori (dikotomi)</strong>, satu sampel.",
    contoh:"Apakah proporsi responden yang memilih 'setuju' (60%) berbeda signifikan dari proporsi yang diharapkan (50%)?" },
  { name:"Chi-square Satu Sampel", skala:["nominal"],jenis:["nonpara"], ci:"ci-nom",cat:"cat-nom",emoji:"📊",
    deskripsi:"Menguji apakah frekuensi observasi pada tiap kategori sesuai dengan frekuensi yang diharapkan berdasarkan teori. Cocok untuk lebih dari dua kategori.",
    kapan:"Satu sampel, data nominal <strong>≥2 kategori</strong>, membandingkan distribusi observasi vs teori.",
    syarat:"Frekuensi harapan tiap sel <strong>≥ 5</strong>, data nominal, satu sampel.",
    contoh:"Apakah distribusi agama mahasiswa (Islam 70%, Kristen 15%, lainnya 15%) sesuai distribusi populasi umum?" },
  { name:"Mc Nemar Test", skala:["nominal"],jenis:["nonpara"], ci:"ci-nom",cat:"cat-nom",emoji:"🔄",
    deskripsi:"Menguji perubahan proporsi pada dua pengukuran berpasangan dari subjek yang sama (sebelum–sesudah). Dirancang khusus untuk data dikotomi.",
    kapan:"Dua kelompok <strong>berpasangan</strong>, data nominal dikotomi, mengukur perubahan sebelum–sesudah intervensi.",
    syarat:"Data dikotomi (2 kategori), kelompok berpasangan, <strong>desain pre-post</strong>.",
    contoh:"Apakah ada perubahan signifikan proporsi mahasiswa 'tidak paham' → 'paham' setelah pelatihan?" },

let activeFilter = 'semua';
let searchQuery  = '';
let openCards    = new Set();

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => { b.className = 'filter-btn'; });
  btn.classList.add('act-' + f);
  openCards.clear();
  renderCards();
}

function filterCards() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase();
  openCards.clear();
  renderCards();
}

function renderCards() {
  const grid     = document.getElementById('cardsGrid');
  const filtered = data.filter(d => {
    const mf = activeFilter==='semua'
      || (activeFilter==='nominal'    && d.skala.includes('nominal'))
      || (activeFilter==='ordinal'    && d.skala.includes('ordinal'))
      || (activeFilter==='interval'   && d.skala.includes('interval'))
      || (activeFilter==='parametrik' && d.jenis.includes('parametrik'))
      || (activeFilter==='nonpara'    && d.jenis.includes('nonpara'));
    const ms = !searchQuery
      || d.name.toLowerCase().includes(searchQuery)
      || d.deskripsi.toLowerCase().includes(searchQuery)
      || d.kapan.toLowerCase().includes(searchQuery);
    return mf && ms;
  });

  document.getElementById('countNum').textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = `<div class="no-result"><span class="no-emoji">🔍</span>Tidak ada hasil untuk "<strong>${searchQuery}</strong>"<br>Coba kata kunci lain ya~ 🌸</div>`;
    return;
  }

  grid.innerHTML = filtered.map((d, i) => {
    const skalaTags = d.skala.map(s =>
      s==='nominal' ? '<span class="tag t-nom">🎀 Nominal</span>' :
      s==='ordinal' ? '<span class="tag t-ord">💜 Ordinal</span>' :
                     '<span class="tag t-int">💙 Interval/Rasio</span>'
    ).join('');
    const jenisTags = d.jenis.map(j =>
      j==='parametrik' ? '<span class="tag t-par">🌿 Parametrik</span>'
                       : '<span class="tag t-non">🍊 Non-Parametrik</span>'
    ).join('');
    const isOpen = openCards.has(i);
    return `
    <div class="uji-card ${d.cat} ${isOpen?'open':''}" id="card-${i}" onclick="toggleCard(${i})">
      <div class="card-header">
        <div class="card-icon ${d.ci}">${d.emoji}</div>
        <div class="card-meta">
          <div class="card-name">${d.name}</div>
          <div class="card-tags">${skalaTags}${jenisTags}</div>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="body-section sec-def">
            <div class="body-label"><span class="lbl-icon">💙</span> Pengertian</div>
            <div class="body-text">${d.deskripsi}</div>
          </div>
          <div class="body-section sec-when">
            <div class="body-label"><span class="lbl-icon">🌿</span> Kapan Digunakan</div>
            <div class="body-text">${d.kapan}</div>
          </div>
          <div class="body-section sec-req">
            <div class="body-label"><span class="lbl-icon">🎀</span> Syarat Penggunaan</div>
            <div class="body-text">${d.syarat}</div>
          </div>
          <div class="body-section sec-ex full">
            <div class="body-label"><span class="lbl-icon">🌸</span> Contoh Kasus</div>
            <div class="example-box">${d.contoh}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  const card = document.getElementById('card-'+i);
  if (openCards.has(i)) { openCards.delete(i); card.classList.remove('open'); }
  else                   { openCards.add(i);    card.classList.add('open');    }
}

window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').classList.toggle('visible', scrollY > 300);
});

renderCards();
</script>
