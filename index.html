<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panduan Uji Statistik Punya Marisa🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Floating clouds -->
  <div class="clouds-bg" id="cloudsBg"></div>

  <!-- Twinkling stars -->
  <div class="stars-bg" id="starsBg"></div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="cinna-icon">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSjUuURH3Ynl8_8WeFtOZbujwvP5zvK8VVycQ&s" alt="" style="height: 80px; border-radius: 15px;">
        </div>
        <div class="header-titles">
          <div class="site-title">Panduan Uji <span>Statistik</span> Punya Marisa✨</div>
          <div class="site-subtitle">Belajar jadi lebih manis bersama Cinnamoroll ☁️</div>
        </div>
      </div>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="text"
          placeholder="Cari nama uji... (Anova, Spearman, Chi-square, t-test...)"
          oninput="filterCards()" />
      </div>

      <div class="filter-row">
        <span class="filter-label">Filter ☁️</span>
        <button class="filter-btn act-semua"    data-f="semua"      onclick="setFilter('semua',this)">🌸 Semua</button>
        <button class="filter-btn"              data-f="nominal"    onclick="setFilter('nominal',this)">🎀 Nominal</button>
        <button class="filter-btn"              data-f="ordinal"    onclick="setFilter('ordinal',this)">💜 Ordinal</button>
        <button class="filter-btn"              data-f="interval"   onclick="setFilter('interval',this)">💙 Interval</button>
        <button class="filter-btn"              data-f="parametrik" onclick="setFilter('parametrik',this)">🌿 Parametrik</button>
        <button class="filter-btn"              data-f="nonpara"    onclick="setFilter('nonpara',this)">🍊 Non-Para</button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#f9a0b8"></span>Nominal — kategori tanpa urutan</div>
      <div class="legend-item"><span class="legend-dot" style="background:#c4a8e8"></span>Ordinal — data bertingkat</div>
      <div class="legend-item"><span class="legend-dot" style="background:#80c8e8"></span>Interval/Rasio — data numerik kontinu</div>
    </div>

    <div class="count-bar">
      <span class="count-text">Menampilkan <span class="count-num" id="countNum">0</span> alat uji ✨</span>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>

    <div class="deco-footer">🐾 ☁️ ⭐ ☁️ 🎀 ☁️ ⭐ ☁️ 🐾</div>
  </main>

  <button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script src="script.js"></script>
</body>
</html>
